<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a0c" />
    <script>
      // Set the theme before first paint: saved choice, else the system preference.
      (function () {
        var t = null;
        try { t = localStorage.getItem("mp-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>MethodePay — Accept payments anywhere. No WooCommerce. No rejections.</title>
    <meta
      name="description"
      content="MethodePay is a standalone WordPress payment plugin. 9+ payment methods, 6 checkout designs, live editor, instant trial-code delivery. No WooCommerce required."
    />
    <link rel="canonical" href="https://methodepay.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MethodePay" />
    <meta property="og:title" content="MethodePay — Accept payments anywhere" />
    <meta
      property="og:description"
      content="Take payments on WordPress without WooCommerce. Built for merchants Stripe and PayPal turn away."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
